name: Nderto APK – Histori dhe Legjenda (Qiri)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QIRI_CANDLE_APP.zip.part1'
      - 'QIRI_CANDLE_APP.zip.part2'
      - '.github/workflows/QIRI_APK_ME_LOGO_QIRI.yml'

permissions:
  contents: read

jobs:
  nderto-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Merr materialet e repository
        uses: actions/checkout@v4
      - name: Bashko dy pjeset dhe nxirr projektin
        run: |
          test -s QIRI_CANDLE_APP.zip.part1
          test -s QIRI_CANDLE_APP.zip.part2
          cat QIRI_CANDLE_APP.zip.part1 QIRI_CANDLE_APP.zip.part2 > qiri_app.zip
          unzip -tqq qiri_app.zip
          mkdir -p android-project
          unzip -q qiri_app.zip -d android-project
          test -s android-project/app/src/main/assets/book.html
          test -s android-project/app/src/main/assets/narration_sq.json
          test -s android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Konfiguro Android SDK
        uses: android-actions/setup-android@v3
      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Konfiguro Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Kompilo APK (debug – per instalim dhe test)
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Kontrollo skedarin APK
        run: test -s android-project/app/build/outputs/apk/debug/app-debug.apk
      - name: Ruaj APK per shkarkim
        uses: actions/upload-artifact@v4
        with:
          name: QIRI_ANDROID_APK_ME_LOGO_QIRI
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
