name: Build Android APK V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project
        run: |
          cat QIRI_ANDROID_API36_PART1.bin QIRI_ANDROID_API36_PART2.bin > qiri.zip
          rm -rf project && mkdir project
          unzip -q qiri.zip -d project
          test -f project/app/src/main/assets/www/app.js

      - name: Fullscreen book UI
        run: |
          cat >> project/app/src/main/assets/www/app.css <<'CSS'
          header,footer{display:none!important}main{position:fixed!important;inset:0!important}#bookView{inset:0!important;padding:0!important}#stage{width:100vw;height:100dvh;gap:2px}.pageimg{max-width:100vw!important;max-height:100dvh!important;object-fit:contain!important}.landscape .pageimg{max-width:50vw!important}#qM,#qL,#qR,#qP{position:fixed;z-index:90;background:#17100cdd;color:#fff9ed;border:1px solid #e3bf7c88}#qM{right:10px;top:10px;width:42px;height:42px;border-radius:50%}#qL,#qR{top:50%;transform:translateY(-50%);width:38px;height:54px;font-size:26px;background:#17100c88}#qL{left:6px}#qR{right:6px}#qP{left:50%;bottom:8px;transform:translateX(-50%);padding:5px 10px;border-radius:20px}#qB{position:fixed;inset:0;z-index:94;background:#0008;display:none}#qD{position:fixed;z-index:95;top:0;right:0;width:min(88vw,360px);height:100dvh;overflow:auto;background:#17100cf7;padding:12px;transform:translateX(102%);transition:.2s}body.qOpen #qB{display:block}body.qOpen #qD{transform:none}#qS{display:grid;grid-template-columns:1fr 1fr;gap:6px}#qPages{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}#qPages button,#qS button{padding:8px 5px}#qPages .on{background:#e3bf7c;color:#17100c}#qD h3{color:#e3bf7c;font-size:13px}body.qReader #bookView{display:none!important}body.qReader #readerView{display:block!important}body.qReader #readerControls{display:flex!important}
          CSS

          cat >> project/app/src/main/assets/www/app.js <<'JS'
          let qBusy=false;const Q=[['Kopertina',1],['Hyrja',2],['Përmbajtja',3],['Historitë',4],['Emigracioni',29],['Legjendat',33],['Jeta e përditshme',73],['Dy urat',104],['Hartat',106],['Burimet',114],['Mbyllja',116]];
          function qLeft(){return isLandscape()&&page>1?(page%2?page-1:page):page}function qLab(){let l=qLeft();return isLandscape()&&page>1&&l<PAGE_COUNT?`${l}–${l+1} / ${PAGE_COUNT}`:`${page} / ${PAGE_COUNT}`}
          renderBook=function(){page=Math.max(1,Math.min(PAGE_COUNT,page));localStorage.qiriPage=page;$('counter').textContent=qLab();$('pageRange').value=page;stage.innerHTML='';stage.className=isLandscape()?'landscape':'';const m=n=>{let i=new Image();i.className='pageimg';i.draggable=false;i.src=`pages/${String(n).padStart(3,'0')}.webp`;return i};if(isLandscape()&&page>1){let l=qLeft();stage.append(m(l));if(l<PAGE_COUNT)stage.append(m(l+1))}else stage.append(m(page));applyTransform();qUpd()};
          go=function(d){if(qBusy)return;let n=Math.max(1,Math.min(PAGE_COUNT,page+d));if(n===page)return;qBusy=true;stage.animate([{transform:'perspective(1200px) rotateY(0)'},{transform:`perspective(1200px) rotateY(${d>0?-12:12}deg)`,filter:'brightness(.65)'}],{duration:140}).onfinish=()=>{page=n;resetZoom();renderBook();stage.animate([{opacity:.55,transform:`translateX(${d>0?25:-25}px)`},{opacity:1,transform:'none'}],{duration:180
