name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project ZIP
        run: |
          cat QIRI_ANDROID_API36_PART1.bin QIRI_ANDROID_API36_PART2.bin > qiri_android_api36.zip
          mkdir project
          unzip -q qiri_android_api36.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/www/pages/118.webp

      - name: Use candle as app icon
        run: |
          mkdir -p project/app/src/main/res/drawable
          mkdir -p project/app/src/main/res/mipmap-anydpi-v26
          mkdir -p project/app/src/main/res/values

          cat > project/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Candle body -->
              <path
                  android:fillColor="#E7C47A"
                  android:pathData="M42,48 L66,48 L66,86 L42,86 Z"/>

              <!-- Candle highlight -->
              <path
                  android:fillColor="#F7E6B3"
                  android:pathData="M46,52 L51,52 L51,82 L46,82 Z"/>

              <!-- Wick -->
              <path
                  android:fillColor="#3A2A1F"
                  android:pathData="M52,40 L56,40 L56,49 L52,49 Z"/>

              <!-- Flame -->
              <path
                  android:fillColor="#FFD66B"
                  android:pathData="M54,16 C44,27 46,38 54,43 C62,38 64,27 54,16 Z"/>

              <!-- Inner flame -->
              <path
                  android:fillColor="#FFF4C6"
                  android:pathData="M54,23 C49,30 50,35 54,38 C58,35 59,30 54,23 Z"/>

              <!-- Small wax drip -->
              <path
                  android:fillColor="#F7E6B3"
                  android:pathData="M58,48 C58,55 62,57 62,62 C62,65 60,67 58,67 Z"/>
          </vector>
          EOF

          cat > project/app/src/main/res/values/icon_colors.xml <<'EOF'
          <resources>
              <color name="qiri_icon_bg">#17100C</color>
          </resources>
          EOF

          cat > project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/qiri_icon_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/qiri_icon_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Histori-Legjenda-Nen-Qiri-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
