name: "Histori dhe Legjenda nen Qiri V87 - APK FIX"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/QIRI_V87_NDERTO_APK.yml'
      - 'QIRI_V87_ANDROID_ZERA_ONLINE_PROJEKTI.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Shkarko projektin
        uses: actions/checkout@v4

      - name: Nxirr projektin Android V87
        shell: bash
        run: |
          set -e
          test -s QIRI_V87_ANDROID_ZERA_ONLINE_PROJEKTI.zip
          unzip -tq QIRI_V87_ANDROID_ZERA_ONLINE_PROJEKTI.zip
          mkdir -p v87
          unzip -q QIRI_V87_ANDROID_ZERA_ONLINE_PROJEKTI.zip -d v87
          test -f v87/app/build.gradle
          test -f v87/app/src/main/assets/index.html
          test -f v87/app/src/main/assets/book_texts.json
          test -f v87/app/src/main/java/al/qiri/reader/NarrationService.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || exit 1
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          (yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1) || true
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -d "$SDK/platforms/android-35"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Nderto APK
        working-directory: v87
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Ruaj APK
        uses: actions/upload-artifact@v4
        with:
          name: QIRI-V87-Android-APK
          path: v87/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
