name: "NEN QIRI V80 - AUTO APK"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/QIRI_V80_AUTO_APK.yml'
permissions:
  contents: read
concurrency:
  group: qiri-v80-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Vendos ndryshimet V80
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          payload=''''''
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as z:
           z.extractall('v80_changes')
          print('Ndryshimet V80 u vendosen')
          PY
      - name: Rindërto burimin e verifikuar V79
        shell: bash
        run: |
          set -euo pipefail
          for num in 01 02 03 04; do
            unzip -oq "QIRI_V79_PAKETA_${num}.zip" -d .
          done
          sha256sum -c IMAZHE_SHA256_V79.txt
          cp app/src/main/assets/www/index.html v79-verified-base.html
          python3 v80_changes/apply_v80.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrollo ruajtjen e përmbajtjes dhe sintaksën
        run: |
          python3 v80_changes/verify_content.py
          node v80_changes/qa_logic.cjs
          sha256sum -c IMAZHE_SHA256_V79.txt
      - name: Provo lexuesin, gjestet, audion dhe leximin offline
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node v80_changes/qa_reader.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kompilo dhe verifiko APK V80
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > qa-results/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEN-QIRI-V80-APK-TEST
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEN-QIRI-V80-QA
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
