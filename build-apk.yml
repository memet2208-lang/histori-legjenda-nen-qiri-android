name: Build Nen Qiri Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check book.pdf
        run: |
          test -f book.pdf || (echo "Mungon book.pdf ne root te repository-t." && exit 1)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/al/nenqiri/ebook
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp book.pdf app/src/main/assets/book.pdf

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NenQiriEbook"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'al.nenqiri.ebook'
              compileSdk 35

              defaultConfig {
                  applicationId 'al.nenqiri.ebook'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#C79A59</item>
                  <item name="android:navigationBarColor">#17100C</item>
                  <item name="android:statusBarColor">#17100C</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Histori dhe Legjenda nën Qiri"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/al/nenqiri/ebook/MainActivity.java <<'EOF'
          package al.nenqiri.ebook;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.res.Configuration;
          import android.graphics.*;
          import android.graphics.pdf.PdfRenderer;
          import android.speech.tts.TextToSpeech;
          import android.view.*;
          import android.widget.*;
          import android.graphics.drawable.ColorDrawable;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import java.io.*;
          import java.util.*;
          import java.util.concurrent.*;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {

              private PdfRenderer renderer;
              private ParcelFileDescriptor pfd;
              private LinearLayout pageBox;
              private TextView counter;
              private SeekBar slider;
              private int page = 0;
              private int pageCount = 0;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final HashMap<Integer,String> ocrCache = new HashMap<>();
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private final int bg = Color.rgb(23,16,12);
              private final int gold = Color.rgb(227,191,124);
              private final int cream = Color.rgb(255,249,237);

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);

                  buildUi();
                  tts = new TextToSpeech(this, this);

                  try {
                      File pdf = ensurePdf();
                      pfd = ParcelFileDescriptor.open(pdf, ParcelFileDescriptor.MODE_READ_ONLY);
                      renderer = new PdfRenderer(pfd);
                      pageCount = renderer.getPageCount();

                      page = getPreferences(MODE_PRIVATE).getInt("page",0);
                      if (page < 0 || page >= pageCount) page = 0;

                      slider.setMax(Math.max(0,pageCount-1));
                      slider.setProgress(page);
                      render();
                  } catch (Exception e) {
                      showError("Nuk u hap libri: " + e.getMessage());
                  }
              }

              private File ensurePdf() throws IOException {
                  File out = new File(getFilesDir(),"book.pdf");
                  if (!out.exists() || out.length()==0) {
                      try (InputStream in = getAssets().open("book.pdf");
                           OutputStream os = new FileOutputStream(out)) {
                          byte[] buf = new byte[1024*1024];
                          int n;
                          while ((n=in.read(buf))>0) os.write(buf,0,n);
                      }
                  }
                  return out;
              }

              private Button btn(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(cream);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.rgb(52,37,27));
                  b.setPadding(12,4,12,4);
                  return b;
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(6,4,6,4);

                  Button prev = btn("◀");
                  Button next = btn("▶");
                  Button read = btn("Aa Lexim");
                  Button voice = btn("🔊 Zë");

                  counter = new TextView(this);
                  counter.setTextColor(gold);
                  counter.setGravity(Gravity.CENTER);
                  counter.setTextSize(15);

                  top.addView(prev,new LinearLayout.LayoutParams(0,50,1));
                  top.addView(counter,new LinearLayout.LayoutParams(0,50,2));
                  top.addView(read,new LinearLayout.LayoutParams(0,50,2));
                  top.addView(voice,new LinearLayout.LayoutParams(0,50,1.5f));
                  top.addView(next,new LinearLayout.LayoutParams(0,50,1));

                  pageBox = new LinearLayout(this);
                  pageBox.setOrientation(LinearLayout.HORIZONTAL);
                  pageBox.setGravity(Gravity.CENTER);
                  pageBox.setBackgroundColor(Color.BLACK);

                  slider = new SeekBar(this);
                  slider.setPadding(12,2,12,2);

                  root.addView(top);
                  root.addView(pageBox,new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,0,1));
                  root.addView(slider,new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,46));

                  setContentView(root);

                  prev.setOnClickListener(v -> move(isLandscape() ? -2 : -1));
                  next.setOnClickListener(v -> move(isLandscape() ? 2 : 1));
                  read.setOnClickListener(v -> openReadingMode(false));
                  voice.setOnClickListener(v -> openReadingMode(true));

                  slider.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s,int value,boolean fromUser) {
                          if (fromUser && value < pageCount) {
                              page=value;
                              render();
                          }
                      }
                      public void onStartTrackingTouch(SeekBar s){}
                      public void onStopTrackingTouch(SeekBar s){}
                  });
              }

              private boolean isLandscape() {
                  return getResources().getConfiguration().orientation
                          == Configuration.ORIENTATION_LANDSCAPE;
              }

              private void move(int delta) {
                  page = Math.max(0, Math.min(pageCount-1,page+delta));
                  slider.setProgress(page);
                  render();
              }

              private int leftLandscapePage() {
                  if (page <= 0) return 0;
                  return (page % 2 == 1) ? page : page-1;
              }

              private void render() {
                  if (renderer == null || pageCount == 0) return;

                  pageBox.removeAllViews();

                  if (isLandscape() && page > 0) {
                      int left = leftLandscapePage();
                      addPage(left,0.5f);
                      if (left+1 < pageCount) addPage(left+1,0.5f);
                      counter.setText((left+1) + "–" + Math.min(pageCount,left+2) + " / " + pageCount);
                  } else {
                      addPage(page,1f);
                      counter.setText((page+1) + " / " + pageCount);
                  }

                  slider.setProgress(page);
                  getPreferences(MODE_PRIVATE).edit().putInt("page",page).apply();
              }

              private void addPage(int index,float weight) {
                  ZoomImageView view = new ZoomImageView(this);
                  view.setBackgroundColor(Color.BLACK);
                  pageBox.addView(view,new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.MATCH_PARENT,weight));

                  executor.submit(() -> {
                      Bitmap b = renderBitmap(index, 1.5f);
                      runOnUiThread(() -> view.setImageBitmap(b));
                  });
              }

              private Bitmap renderBitmap(int index,float scale) {
                  synchronized (this) {
                      PdfRenderer.Page p = renderer.openPage(index);
                      int w = Math.max(1,(int)(p.getWidth()*scale));
                      int h = Math.max(1,(int)(p.getHeight()*scale));
                      Bitmap b = Bitmap.createBitmap(w,h,Bitmap.Config.ARGB_8888);
                      b.eraseColor(Color.WHITE);
                      p.render(b,null,null,PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      p.close();
                      return b;
                  }
              }

              private void openReadingMode(boolean autoSpeak) {
                  final int current = page;
                  if (ocrCache.containsKey(current)) {
                      showReader(ocrCache.get(current),autoSpeak);
                      return;
                  }

                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setMessage("Po përgatis tekstin...");
                  pd.setCancelable(false);
                  pd.show();

                  executor.submit(() -> {
                      Bitmap b = renderBitmap(current,2.2f);
                      runOnUiThread(() -> {
                          InputImage image = InputImage.fromBitmap(b,0);
                          TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                                  .process(image)
                                  .addOnSuccessListener(result -> {
                                      pd.dismiss();
                                      String txt = result.getText();
                                      ocrCache.put(current,txt);
                                      showReader(txt,autoSpeak);
                                  })
                                  .addOnFailureListener(err -> {
                                      pd.dismiss();
                                      showError("Teksti nuk u lexua: "+err.getMessage());
                                  });
                      });
                  });
              }

              private void showReader(String text, boolean autoSpeak) {
                  if (text == null || text.trim().isEmpty()) {
                      showError("Nuk u gjet tekst në këtë faqe.");
                      return;
                  }

                  final Dialog d = new Dialog(this,android.R.style.Theme_Material_Light_NoActionBar_Fullscreen);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(246,237,221));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setPadding(6,5,6,5);
                  bar.setBackgroundColor(bg);

                  Button close = btn("✕");
                  Button minus = btn("A−");
                  Button plus = btn("A+");
                  Button play = btn("▶ Lexo");
                  Button pause = btn("⏸");
                  Button stop = btn("⏹");

                  bar.addView(close,new LinearLayout.LayoutParams(0,52,1));
                  bar.addView(minus,new LinearLayout.LayoutParams(0,52,1));
                  bar.addView(plus,new LinearLayout.LayoutParams(0,52,1));
                  bar.addView(play,new LinearLayout.LayoutParams(0,52,2));
                  bar.addView(pause,new LinearLayout.LayoutParams(0,52,1));
                  bar.addView(stop,new LinearLayout.LayoutParams(0,52,1));

                  ScrollView sv = new ScrollView(this);
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.rgb(42,33,27));
                  tv.setTextSize(24);
                  tv.setLineSpacing(8,1.18f);
                  tv.setPadding(22,22,22,80);
                  sv.addView(tv);

                  root.addView(bar);
                  root.addView(sv,new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,0,1));
                  d.setContentView(root);

                  close.setOnClickListener(v -> { stopSpeech(); d.dismiss(); });
                  minus.setOnClickListener(v -> tv.setTextSize(Math.max(18,tv.getTextSize()/getResources().getDisplayMetrics().scaledDensity-2)));
                  plus.setOnClickListener(v -> tv.setTextSize(Math.min(40,tv.getTextSize()/getResources().getDisplayMetrics().scaledDensity+2)));
                  play.setOnClickListener(v -> speak(text));
                  pause.setOnClickListener(v -> stopSpeech());
                  stop.setOnClickListener(v -> stopSpeech());

                  d.setOnDismissListener(x -> stopSpeech());
                  d.show();

                  if (autoSpeak) speak(text);
              }

              private void speak(String text) {
                  if (!ttsReady) {
                      Toast.makeText(this,"Zëri shqip nuk është gati në telefon.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  tts.stop();
                  tts.setSpeechRate(0.95f);
                  tts.speak(text,TextToSpeech.QUEUE_FLUSH,null,"nen-qiri");
              }

              private void stopSpeech() {
                  if (tts != null) tts.stop();
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                      Locale sq = new Locale("sq","AL");
                      int r = tts.setLanguage(sq);
                      if (r == TextToSpeech.LANG_MISSING_DATA ||
                          r == TextToSpeech.LANG_NOT_SUPPORTED) {
                          r = tts.setLanguage(Locale.getDefault());
                      }
                      ttsReady = r != TextToSpeech.LANG_MISSING_DATA &&
                                 r != TextToSpeech.LANG_NOT_SUPPORTED;
                  }
              }

              private void showError(String msg) {
                  new AlertDialog.Builder(this)
                          .setTitle("Nën Qiri")
                          .setMessage(msg)
                          .setPositiveButton("OK",null)
                          .show();
              }

              @Override
              public void onConfigurationChanged(Configuration c) {
                  super.onConfigurationChanged(c);
                  render();
              }

              @Override
              protected void onDestroy() {
                  executor.shutdownNow();
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  if (renderer != null) renderer.close();
                  try { if (pfd != null) pfd.close(); } catch(Exception ignored){}
                  super.onDestroy();
              }

              static class ZoomImageView extends androidx.appcompat.widget.AppCompatImageView {
                  private final Matrix matrix = new Matrix();
                  private final float[] values = new float[9];
                  private ScaleGestureDetector scaleDetector;
                  private GestureDetector gestureDetector;
                  private float scale = 1f;
                  private float lastX,lastY;

                  public ZoomImageView(Context c) {
                      super(c);
                      setScaleType(ScaleType.MATRIX);

                      scaleDetector = new ScaleGestureDetector(c,
                              new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                                  @Override
                                  public boolean onScale(ScaleGestureDetector d) {
                                      float f = d.getScaleFactor();
                                      float newScale = Math.max(1f,Math.min(5f,scale*f));
                                      f = newScale/scale;
                                      scale = newScale;
                                      matrix.postScale(f,f,d.getFocusX(),d.getFocusY());
                                      setImageMatrix(matrix);
                                      return true;
                                  }
                              });

                      gestureDetector = new GestureDetector(c,
                              new GestureDetector.SimpleOnGestureListener() {
                                  @Override
                                  public boolean onDoubleTap(android.view.MotionEvent e) {
                                      if (scale > 1.1f) {
                                          scale=1f;
                                          fitImage();
                                      } else {
                                          scale=2f;
                                          matrix.postScale(2f,2f,e.getX(),e.getY());
                                          setImageMatrix(matrix);
                                      }
                                      return true;
                                  }
                              });
                  }

                  @Override
                  public void setImageBitmap(Bitmap bm) {
                      super.setImageBitmap(bm);
                      post(this::fitImage);
                  }

                  private void fitImage() {
                      if (getDrawable()==null || getWidth()==0 || getHeight()==0) return;
                      float dw=getDrawable().getIntrinsicWidth();
                      float dh=getDrawable().getIntrinsicHeight();
                      float s=Math.min(getWidth()/dw,getHeight()/dh);
                      float dx=(getWidth()-dw*s)/2f;
                      float dy=(getHeight()-dh*s)/2f;
                      matrix.reset();
                      matrix.postScale(s,s);
                      matrix.postTranslate(dx,dy);
                      setImageMatrix(matrix);
                      scale=1f;
                  }

                  @Override
                  public boolean onTouchEvent(android.view.MotionEvent e) {
                      gestureDetector.onTouchEvent(e);
                      scaleDetector.onTouchEvent(e);

                      switch(e.getActionMasked()) {
                          case android.view.MotionEvent.ACTION_DOWN:
                              lastX=e.getX();lastY=e.getY();return true;
                          case android.view.MotionEvent.ACTION_MOVE:
                              if (!scaleDetector.isInProgress() && scale>1f) {
                                  float dx=e.getX()-lastX, dy=e.getY()-lastY;
                                  matrix.postTranslate(dx,dy);
                                  setImageMatrix(matrix);
                                  lastX=e.getX();lastY=e.getY();
                              }
                              return true;
                      }
                      return true;
                  }
              }
          }
          EOF

          # AppCompat only used by the custom zoom ImageView
          python3 - <<'PY'
          p='app/build.gradle'
          s=open(p).read()
          s=s.replace("implementation 'com.google.mlkit:text-recognition:16.0.1'",
                      "implementation 'com.google.mlkit:text-recognition:16.0.1'\n    implementation 'androidx.appcompat:appcompat:1.7.0'")
          open(p,'w').write(s)
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Histori_dhe_Legjenda_nen_Qiri.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Histori-dhe-Legjenda-nen-Qiri-APK
          path: Histori_dhe_Legjenda_nen_Qiri.apk
