          cat > project/app/src/main/java/al/kostumiim/nenqiri/MainActivity.java <<'V8JAVA'
          package al.kostumiim.nenqiri;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Build;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.speech.tts.TextToSpeech;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private WebView web;
              private TextToSpeech tts;
              private boolean ready = false;
              private final Handler handler = new Handler();

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  getWindow().getDecorView().post(this::hideSystemUI);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(true);
                  web.getSettings().setAllowContentAccess(false);
                  web.getSettings().setAllowFileAccessFromFileURLs(true);
                  web.getSettings().setAllowUniversalAccessFromFileURLs(false);
                  web.getSettings().setBuiltInZoomControls(false);
                  web.getSettings().setDisplayZoomControls(false);
                  web.getSettings().setSupportZoom(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  tts = new TextToSpeech(this, this);
                  web.addJavascriptInterface(new TTSBridge(), "QiriTTS");
                  web.loadUrl("file:///android_asset/www/index.html");
              }

              private void hideSystemUI() {
                  View decor = getWindow().getDecorView();
                  if (decor == null) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController c = decor.getWindowInsetsController();
                      if (c == null) {
                          decor.post(this::hideSystemUI);
                          return;
                      }
                      c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                      c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  } else {
                      decor.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }

              @Override public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              @Override public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS) return;
                  int r = tts.setLanguage(new Locale("sq", "AL"));
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED)
                      r = tts.setLanguage(new Locale("sq"));
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED)
                      tts.setLanguage(Locale.getDefault());
                  ready = true;
                  tts.setOnUtteranceProgressListener(new android.speech.tts.UtteranceProgressListener() {
                      @Override public void onStart(String id) {}
                      @Override public void onError(String id) { if (id != null && id.endsWith("-last")) done(false); }
                      @Override public void onDone(String id) { if (id != null && id.endsWith("-last")) done(true); }
                      private void done(boolean ok) {
                          handler.post(() -> web.evaluateJavascript(ok ?
                              "window.qiriTtsDone && window.qiriTtsDone()" :
                              "window.qiriTtsError && window.qiriTtsError()", null));
                      }
                  });
              }

              private ArrayList<String> chunks(String text) {
                  ArrayList<String> out = new ArrayList<>();
                  if (text == null) return out;
                  text = text.trim();
                  final int max = 2800;
                  while (text.length() > max) {
                      int cut = text.lastIndexOf('.', max);
                      if (cut < 1200) cut = text.lastIndexOf(' ', max);
                      if (cut < 800) cut = max;
                      out.add(text.substring(0, cut + 1).trim());
                      text = text.substring(cut + 1).trim();
                  }
                  if (!text.isEmpty()) out.add(text);
                  return out;
              }

              public class TTSBridge {
                  @JavascriptInterface public synchronized void speak(String text, double rate) {
                      if (!ready || tts == null || text == null || text.trim().isEmpty()) {
                          handler.post(() -> web.evaluateJavascript("window.qiriTtsError && window.qiriTtsError()", null));
                          return;
                      }
                      tts.stop();
                      tts.setSpeechRate((float)Math.max(.65, Math.min(1.25, rate)));
                      ArrayList<String> list = chunks(text);
                      long stamp = System.currentTimeMillis();
                      for (int i=0;i<list.size();i++) {
                          boolean last=i==list.size()-1;
                          tts.speak(list.get(i), i==0?TextToSpeech.QUEUE_FLUSH:TextToSpeech.QUEUE_ADD,
                              new Bundle(), "qiri-"+stamp+"-"+i+(last?"-last":""));
                      }
                  }
                  @JavascriptInterface public synchronized void stop() { if (tts != null) tts.stop(); }
                  @JavascriptInterface public boolean isReady() { return ready; }
              }

              @Override public void onBackPressed() {
                  web.evaluateJavascript("document.body.classList.contains('menuOpen')", value -> {
                      if ("true".equals(value)) web.evaluateJavascript("document.getElementById('closeMenu').click()", null);
                      else super.onBackPressed();
                  });
              }

              @Override protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }

