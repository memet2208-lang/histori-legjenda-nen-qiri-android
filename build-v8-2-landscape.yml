           {t:'Shtriga – hyrja',wide:49,tts:[96]},
           {t:'Shtriga – vijimi',wide:50,tts:[96]},
           {t:'Kulshedra dhe Dragoi – hyrja',wide:51,tts:[97]},
           {t:'Kulshedra dhe Dragoi – vijimi',wide:52,tts:[97]},
           {t:'Kostandini dhe Doruntina – hyrja',wide:53,tts:[98]},
           {t:'Kostandini dhe Doruntina – vijimi',wide:54,tts:[98]},
           {t:'Baba Tomorri dhe Shpiragu – hyrja',wide:55,tts:[99]},
           {t:'Baba Tomorri dhe Shpiragu – vijimi',wide:56,tts:[99]},
           {t:'Familja – hyrja e legjendës tjetër',wide:57,voice:'Familja hap rrëfimin tjetër nën dritën e qiririt. Pamja familjare shërben vetëm si hyrje dhe nuk përzihet me një legjendë tjetër.'},
           {t:'Aga Ymeri i Ulqinit – fillimi',p:[58,59],tts:[100]},
           {t:'Aga Ymeri i Ulqinit – vijimi',wide:60,tts:[100]},
           {t:'E Bukura e Dheut – I',wide:61,tts:[101]},
           {t:'E Bukura e Dheut – II',wide:62,tts:[101]},
           {t:'E Bukura e Dheut – III',wide:63,tts:[101]},
           {t:'E Bukura e Dheut – IV',wide:64,tts:[101]},
           {t:'E Bukura e Dheut – V',wide:65,tts:[101]},
           {t:'E Bukura e Dheut – VI',wide:66,tts:[101]},
           {t:'Syri i Kaltër dhe Lubia – I',p:[67,68],tts:[102]},
           {t:'Syri i Kaltër dhe Lubia – II',p:[69,70],tts:[102]},
           {t:'Syri i Kaltër dhe Lubia – III',p:[71,72],tts:[102]},
           {t:'Jeta e përditshme – hyrja',p:[73,74],voice:'Jeta e përditshme. Këto faqe paraqesin ushqimin, punën, banesën, mjetet, lëvizjen, shkëmbimin dhe zakonet. Leximi vazhdon temë pas teme, pa i përzier dy tema në të njëjtën dyfaqëshe.'},
           {t:'Gjuetia',p:[75,76],voice:'Gjuetia. Njerëzit përdorën mjete të ndryshme, nga shtizat dhe harqet te kurthet dhe teknikat e bashkëpunimit. Mjetet, gjurmët e kafshëve, organizimi i grupit dhe njohja e terrenit ndryshuan me kohën dhe mjedisin.'},
           {t:'Mbledhja dhe natyra',p:[77,78],voice:'Mbledhja. Frutat, farat, rrënjët, bimët, mjalti dhe burime të tjera natyrore plotësonin ushqimin. Njohja e stinëve dhe e bimëve ishte pjesë e dijes së përditshme dhe trashëgohej mes brezave.'},
           {t:'Blegtoria',p:[79,80],voice:'Blegtoria. Zbutja dhe rritja e kafshëve solli qumësht, mish, lesh, lëkurë dhe fuqi pune. Strehimi i tufave, kullotat dhe lëvizjet sezonale ishin pjesë e organizimit të jetës blegtorale.'},
           {t:'Bujqësia',p:[81,82],voice:'Bujqësia. Punimi i tokës, mbjellja, ujitja, korrja, ruajtja e prodhimeve dhe përdorimi i veglave kërkonin përvojë dhe bashkëpunim. Drithërat dhe kulturat e tjera u bënë bazë e jetës së vendosur.'},
           {t:'Zejtaria',p:[83,84],voice:'Zejtaria. Guri, balta, druri, metali, leshi dhe fibrat shndërroheshin në mjete, enë, armë, stoli, tekstile dhe objekte të përdorimit të përditshëm. Çdo zanat kërkonte mjete dhe njohuri të veçanta.'},
           {t:'Banesa',p:[85,86],voice:'Banesa. Nga strehët e para dhe shpellat deri te shtëpitë prej guri e druri, ndërtimi përshtatej me klimën, materialet vendase dhe mënyrën e jetesës. Brenda banesës organizoheshin zjarri, ruajtja, puna dhe jeta familjare.'},
           {t:'Ushqimi dhe gatimi',p:[87,88],voice:'Ushqimi dhe gatimi. Zjarri, enët, furra, bluarja dhe ruajtja e ushqimit krijuan mënyra të ndryshme për përgatitjen e bukës, mishit, drithërave, bulmetit dhe gatimeve familjare.'},
           {t:'Veshja dhe stolitë',p:[89,90],voice:'Veshja dhe stolitë. Materialet, ngjyrat, qëndisjet, mbulesat dhe stolitë tregonin mjeshtëri, identitet, moshë, rast dhe përkatësi krahinore. Prodhimi i veshjes lidhej me tjerrjen, endjen, qepjen dhe zbukurimin.'},
           {t:'Transporti dhe udhëtimi',p:[91,92],voice:'Transporti dhe udhëtimi. Ecja, kafshët e ngarkesës, karrocat, urat, rrugët dhe lundrimi lidhnin familjet, fshatrat, qytetet dhe tregjet. Terreni përcaktonte shpesh mënyrën e udhëtimit.'},
           {t:'Tregtia dhe tregjet',p:[93,94],voice:'Tregtia dhe tregjet. Shkëmbimi i mallrave, monedhat, peshat, njësitë e matjes dhe rrugët tregtare krijuan lidhje mes krahinave shqiptare dhe rajoneve përreth.'},
           {t:'Mjetet dhe veglat',p:[95,96],voice:'Mjetet dhe veglat e përditshme ndihmonin në bujqësi, blegtori, gatim, përpunim, ndërtim dhe transport. Forma dhe materiali i tyre lidhej drejtpërdrejt me punën që duhej kryer.'},
           {t:'Uji dhe higjiena',p:[97,98],voice:'Uji dhe higjiena. Burimet, puset, cisternat, kanalet dhe enët e ujit ishin thelbësore për jetën. Uji shërbente për pirje, gatim, larje, blegtori dhe bujqësi, ndërsa zakonet e pastërtisë ndryshuan me kohën.'},
           {t:'Armët për mbrojtje personale',p:[99,100],voice:'Armët për mbrojtje personale. Thikat, shpatat, heshtat, mburojat dhe më vonë armët e zjarrit ndryshuan sipas periudhës, teknologjisë dhe mënyrës së luftimit. Këto faqe i trajtojnë si pjesë të kulturës materiale historike.'},
           {t:'Jeta shoqërore, festat dhe zakonet',p:[101,102],voice:'Jeta shoqërore, festat dhe zakonet. Familja, kuvendet, dasmat, ritet, këngët, vallet, mikpritja dhe traditat e përbashkëta forconin lidhjet mes njerëzve dhe brezave.'},
           {t:'Trashëgimia që na bashkon',p:[103,null],voice:'Trashëgimia që na bashkon ruhet në gjuhë, zakone, kujtesë, punë, këngë, ndërtesa, harta dhe tregime. Ajo ndryshon me kohën, por vazhdon të lidhë brezat.'},
           {t:'Urat historike',p:[104,105],voice:'Urat historike. Ura e Mesit dhe Ura e Goricës janë shembuj të lidhjes mes mjeshtërisë së ndërtimit, udhëtimit, tregtisë dhe kujtesës së vendeve ku janë ngritur.'},
           {t:'Hartat historike – I',p:[106,107],voice:'Hartat historike paraqesin ndryshime të hapësirave dhe emërtimeve në periudha të ndryshme. Kufijtë e një harte historike nuk duhen ngatërruar me kufijtë e sotëm.'},
           {t:'Hartat historike – II',p:[108,109],voice:'Këto harta tregojnë ndryshime politike dhe kulturore në Ballkan dhe në trevat shqiptare gjatë periudhave të ndryshme.'},
           {t:'Hartat historike – III',p:[110,111],voice:'Nga periudha mesjetare te ajo osmane, hartat shërbejnë si orientim për të kuptuar kontekstin gjeografik të historive të librit.'},
           {t:'Hartat historike – IV',p:[112,113],voice:'Hartat e periudhës moderne ndihmojnë të kuptojmë ndryshimet politike, shtetin shqiptar dhe shpërndarjen historike të shqiptarëve.'},
           {t:'Burimet',p:[114,115],tts:[103,104,105,106]},
           {t:'Qiriri nuk shuhet',p:[116,117],voice:'Qiriri nuk shuhet. Historitë vazhdojnë sa kohë që tregohen, dëgjohen dhe kalojnë nga një brez te tjetri. Familja mbyll librin, por kujtesa mbetet e ndezur.'},
           {t:'Mbyllja',p:[118,null],voice:'Mbyllja. Shqipëria e sotme ecën përpara duke mbajtur me vete historinë, traditën dhe kujtesën e brezave.'}
          ];

          const $=id=>document.getElementById(id);
          const spreadEl=$('spread'), turnLayer=$('turnLayer');
          let index=Math.max(0,Math.min(SPREADS.length-1,+(localStorage.qiriSpread||0)));
          let turning=false, speaking=false, readerPages=[];
          let drag=null;

          function supplementHTML(n){
            const s=SUPPLEMENTS[n]; if(!s)return '';
            return `<div class="pageSupplement"><strong>${s.h}</strong><p>${s.t}</p></div>`;
          }
          function slotHTML(n){
            if(!n)return `<div class="slot blank" aria-hidden="true"></div>`;
            const src=P(n);
            return `<div class="slot" style="--page-bg:url('${src}')"><img src="${src}" alt="Faqja ${n}" draggable="false">${supplementHTML(n)}</div>`;
          }
          function spreadHTML(s){
            if(s.wide){const src=P(s.wide);return `<div class="wideSlot" style="--page-bg:url('${src}')"><img src="${src}" alt="Dyfaqëshja ${s.wide}" draggable="false"></div>`}
            return slotHTML(s.p[0])+slotHTML(s.p[1]);
          }
          function render(){
            const s=SPREADS[index]; localStorage.qiriSpread=index;
            spreadEl.className=s.wide?'wide':'pair';
            spreadEl.innerHTML=spreadHTML(s);
            $('counter').textContent=`${index+1} / ${SPREADS.length}`;
            document.title=`${s.t} — Histori dhe Legjenda nën Qiri`;
            document.querySelectorAll('#spreadList button').forEach((b,i)=>b.classList.toggle('current',i===index));
          }

          function sideDescriptor(s,side){
            if(s.wide)return {src:P(s.wide),crop:side};
            const n=s.p[side==='left'?0:1];
            return n?{src:P(n),crop:null}:null;
          }
          function applyBg(el,d){
            if(!d){el.style.backgroundImage='none';el.style.backgroundColor='#130c08';return}
            el.style.backgroundImage=`url('${d.src}')`;
            if(d.crop){
              el.style.backgroundSize='200% auto';
              el.style.backgroundPosition=d.crop==='left'?'left center':'right center';
            }else{
              el.style.backgroundSize='contain';el.style.backgroundPosition='center';
            }
          }
          function createTurn(dir){
            const ni=index+dir;if(ni<0||ni>=SPREADS.length)return null;
            const cur=SPREADS[index], nxt=SPREADS[ni];
            const leaf=document.createElement('div');leaf.className=`turnLeaf ${dir>0?'next':'prev'}`;
            const face=document.createElement('div');face.className='leafFace';
            const back=document.createElement('div');back.className='leafBack';
            const under=document.createElement('div');under.className=`underPage ${dir>0?'right':'left'}`;
            applyBg(face,sideDescriptor(cur,dir>0?'right':'left'));
            applyBg(back,sideDescriptor(nxt,dir>0?'left':'right'));
            applyBg(under,sideDescriptor(nxt,dir>0?'right':'left'));
            leaf.append(face,back);turnLayer.append(under,leaf);
            return {dir,ni,leaf,under,progress:0,start:performance.now()};
          }
          function setTurnProgress(obj,p){
            p=Math.max(0,Math.min(1,p));obj.progress=p;
            const a=(obj.dir>0?-178:178)*p;
            obj.leaf.style.transform=`rotateY(${a}deg)`;
            obj.leaf.style.setProperty('--shade',String(.18+.52*p));
          }
          function cleanupTurn(obj){if(!obj)return;obj.leaf.remove();obj.under.remove();turning=false}
          function finishTurn(obj,commit){
            if(!obj)return;
            obj.leaf.classList.add('auto');
            requestAnimationFrame(()=>setTurnProgress(obj,commit?1:0));
            if(commit)setTimeout(()=>{index=obj.ni;render();},360);
            setTimeout(()=>cleanupTurn(obj),790);
          }
          function turn(dir){
            if(turning)return;const obj=createTurn(dir);if(!obj)return;
            stopVoice();turning=true;obj.leaf.classList.add('auto');
            requestAnimationFrame(()=>requestAnimationFrame(()=>setTurnProgress(obj,1)));
            setTimeout(()=>{index=obj.ni;render();},360);setTimeout(()=>cleanupTurn(obj),790);
          }

          function buildMenu(){
            const list=$('spreadList');list.innerHTML='';
            SPREADS.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`${s.t}<small>Dyfaqëshja ${i+1}</small>`;b.onclick=()=>{stopVoice();index=i;render();closeMenu()};list.appendChild(b)});
          }
          function openMenu(){document.body.classList.add('menuOpen');$('menuBtn').setAttribute('aria-expanded','true')}
          function closeMenu(){document.body.classList.remove('menuOpen');$('menuBtn').setAttribute('aria-expanded','false')}

          function cleanText(x){return String(x||'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim()}
          function voiceText(){
            const s=SPREADS[index];let parts=[];
            if(s.voice)parts.push(s.voice);
            if(s.tts&&readerPages.length)parts.push(...s.tts.map(n=>readerPages[n-1]?.text||'').filter(Boolean));
            if(s.p)for(const n of s.p){if(n&&SUPPLEMENTS[n])parts.push(SUPPLEMENTS[n].t)}
            const out=parts.map(cleanText).filter(Boolean).join(' ');
            return out||s.t;
          }
          function nativeSpeak(text){if(window.QiriTTS&&typeof QiriTTS.speak==='function'){try{QiriTTS.speak(text,.92);return true}catch(e){}}return false}
          function fallbackSpeak(text){
            if(!('speechSynthesis'in window))return false;speechSynthesis.cancel();
            const chunks=text.match(/.{1,1100}(?:[.!?](?:\s|$)|$)/g)||[text];let i=0;
            const go=()=>{if(!speaking||i>=chunks.length){window.qiriTtsDone();return}const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='sq-AL';u.rate=.92;const voices=speechSynthesis.getVoices();const v=voices.find(v=>/^sq([-_]|$)/i.test(v.lang));if(v)u.voice=v;u.onend=go;u.onerror=()=>window.qiriTtsDone();speechSynthesis.speak(u)};go();return true;
          }
          function startVoice(){const text=voiceText();if(!text)return;speaking=true;$('voiceBtn').classList.add('speaking');$('voiceBtn').textContent='■';$('voiceBtn').title='Ndalo leximin';if(!nativeSpeak(text)&&!fallbackSpeak(text))window.qiriTtsDone()}
          function stopVoice(){if(window.QiriTTS&&typeof QiriTTS.stop==='function'){try{QiriTTS.stop()}catch(e){}}if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;$('voiceBtn').classList.remove('speaking');$('voiceBtn').textContent='🔊';$('voiceBtn').title='Lexo me zë'}
          window.qiriTtsDone=()=>stopVoice();window.qiriTtsError=()=>stopVoice();

          $('prevBtn').onclick=()=>turn(-1);$('nextBtn').onclick=()=>turn(1);$('menuBtn').onclick=openMenu;$('closeMenu').onclick=closeMenu;$('shade').onclick=closeMenu;$('voiceBtn').onclick=()=>speaking?stopVoice():startVoice();

          const book=$('book');
          book.addEventListener('pointerdown',e=>{
            if(turning||document.body.classList.contains('menuOpen')||e.target.closest('button'))return;
            drag={id:e.pointerId,startX:e.clientX,lastX:e.clientX,lastT:performance.now(),obj:null,dir:0};
            try{book.setPointerCapture(e.pointerId)}catch(_){}
          });
          book.addEventListener('pointermove',e=>{
            if(!drag||drag.id!==e.pointerId)return;
            const dx=e.clientX-drag.startX;
            if(!drag.obj&&Math.abs(dx)>10){
              const dir=dx<0?1:-1;if(index+dir<0||index+dir>=SPREADS.length){drag=null;return}
              stopVoice();turning=true;drag.dir=dir;drag.obj=createTurn(dir);if(!drag.obj){drag=null;turning=false;return}
            }
            if(drag.obj){
              const p=Math.min(1,Math.abs(dx)/(innerWidth*.46));setTurnProgress(drag.obj,p);drag.lastX=e.clientX;drag.lastT=performance.now();
            }
          });
          function endDrag(e){
            if(!drag||drag.id!==e.pointerId)return;
            if(drag.obj){const dx=e.clientX-drag.startX;const elapsed=Math.max(1,performance.now()-drag.obj.start);const speed=Math.abs(dx)/elapsed;const commit=drag.obj.progress>.30||speed>.85;finishTurn(drag.obj,commit)}
            drag=null;
          }
          book.addEventListener('pointerup',endDrag);book.addEventListener('pointercancel',endDrag);
          book.addEventListener('click',e=>{if(turning||drag||document.body.classList.contains('menuOpen')||e.target.closest('button'))return;const x=e.clientX/innerWidth;if(x<.18)turn(-1);else if(x>.82)turn(1)});
          document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')closeMenu()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});

          buildMenu();render();fetch('reader_text.json').then(r=>r.json()).then(d=>{readerPages=d.pages||[]}).catch(()=>{});


