          cat >> project/app/src/main/assets/www/app.js <<'JS'

          /* ==========================================================
             IMMERSIVE BOOK VIEWER V6
             ========================================================== */

          (() => {
            const LEAVES = Array.isArray(window.QIRI_LEAVES)
              ? window.QIRI_LEAVES
              : [];

            const SOURCE_FIRST = window.QIRI_SOURCE_FIRST || {};
            const TOTAL = LEAVES.length;

            if (!TOTAL) {
              console.error('QIRI V6: no logical leaves found');
              return;
            }

            const SECTIONS = [
              ['Kopertina', 1],
              ['Hyrja', 2],
              ['Përmbajtja', 3],
              ['Historitë', 4],
              ['Emigracioni', 29],
              ['Legjendat', 33],
              ['Jeta e përditshme', 73],
              ['Dy urat', 104],
              ['Hartat', 106],
              ['Burimet', 114],
              ['Mbyllja', 116]
            ];

            const $q = id => document.getElementById(id);

            const oldSetMode =
              typeof window.setMode === 'function'
                ? window.setMode
                : (typeof setMode === 'function' ? setMode : null);

            let qLeaf = Math.max(
              1,
              Math.min(
                TOTAL,
                Number(localStorage.getItem('qiriLeafV6')) || 1
              )
            );

            let turning = false;
            let speaking = false;
            let startX = 0;
            let startY = 0;
            let resizeTimer = null;

            function landscape() {
              return window.innerWidth > window.innerHeight;
            }

            function clampLeaf(n) {
              return Math.max(1, Math.min(TOTAL, Number(n) || 1));
            }

            function saveLeaf() {
              localStorage.setItem('qiriLeafV6', String(qLeaf));
            }

            function spreadLeft(index = qLeaf) {
              if (!landscape()) return index;
              if (index === 1 || index >= TOTAL) return index;
              return index % 2 === 0 ? index : index - 1;
            }

            function currentPairLabel() {
              if (!landscape()) {
                return `${qLeaf} / ${TOTAL}`;
              }

              if (qLeaf === 1) {
                return `1 / ${TOTAL}`;
              }

              if (qLeaf >= TOTAL) {
                return `${TOTAL} / ${TOTAL}`;
              }

              const left = spreadLeft(qLeaf);
              return `${left}-${Math.min(left + 1, TOTAL)} / ${TOTAL}`;
            }

            function sourceForLeaf(index) {
              const item = LEAVES[clampLeaf(index) - 1];
              return item ? Number(item.source) : 1;
            }

            function firstLeafForSource(sourcePage) {
              const n = Number(SOURCE_FIRST[String(sourcePage)] || 1);
              return clampLeaf(n);
            }

            function makeSlot(index, side) {
              const slot = document.createElement('div');
              slot.className =
                `qSlot ${side === 'left' ? 'qLeft' : 'qRight'}`;

              if (!index) {
                slot.classList.add('qBlank');
                return slot;
              }

              const item = LEAVES[index - 1];

              if (!item) {
                slot.classList.add('qBlank');
                return slot;
              }

              const img = new Image();
              img.className = 'qLeaf';
              img.alt = `Faqja ${index}`;
              img.draggable = false;
              img.decoding = 'async';
              img.src = item.file;

              img.onerror = () => {
                slot.innerHTML =
                  `<div class="qPageError">Faqja ${index} nuk u ngarkua.</div>`;
              };

              slot.appendChild(img);
              return slot;
            }

            function updateControls() {
              const count = $q('qCount');

              if (count) {
                count.textContent = currentPairLabel();
              }

              const left = spreadLeft();

              document
                .querySelectorAll('#qPages button')
                .forEach(button => {
                  const n = Number(button.dataset.leaf);

                  let active;

                  if (!landscape()) {
                    active = n === qLeaf;
                  } else if (qLeaf === 1) {
                    active = n === 1;
                  } else if (qLeaf >= TOTAL) {
                    active = n === TOTAL;
                  } else {
                    active = n === left || n === left + 1;
                  }

                  button.classList.toggle('on', active);
                });
            }

            function renderV6() {
              const stageEl = document.getElementById('stage');

              if (!stageEl) return;

              qLeaf = clampLeaf(qLeaf);
              saveLeaf();

              stageEl.innerHTML = '';
              stageEl.className = '';
              stageEl.style.transform = 'none';
              stageEl.style.transformOrigin = 'center center';

              if (!landscape()) {
                stageEl.classList.add('qPortrait');
                stageEl.appendChild(makeSlot(qLeaf, 'single'));
              } else {
                stageEl.classList.add('qLandscape');

                if (qLeaf === 1) {
                  stageEl.classList.add('qCover');
                  stageEl.appendChild(makeSlot(null, 'left'));
                  stageEl.appendChild(makeSlot(1, 'right'));
                } else if (qLeaf >= TOTAL) {
                  stageEl.classList.add('qFinal');
                  stageEl.appendChild(makeSlot(TOTAL, 'left'));
                  stageEl.appendChild(makeSlot(null, 'right'));
                } else {
                  const left = spreadLeft(qLeaf);
                  stageEl.appendChild(makeSlot(left, 'left'));
                  stageEl.appendChild(makeSlot(left + 1, 'right'));
                }
              }

              updateControls();
            }

            try {
              window.renderBook = renderV6;
              renderBook = renderV6;
            } catch (_) {
              window.renderBook = renderV6;
            }

            function previousTarget() {
              if (!landscape()) {
                return clampLeaf(qLeaf - 1);
              }

              if (qLeaf <= 1) {
                return 1;
              }

              if (qLeaf >= TOTAL) {
                const p = TOTAL - 1;
                return p <= 1 ? 1 : (p % 2 === 0 ? p : p - 1);
              }

              const left = spreadLeft(qLeaf);

              return left <= 2
                ? 1
                : left - 2;
            }

            function nextTarget() {
              if (!landscape()) {
                return clampLeaf(qLeaf + 1);
              }

              if (qLeaf === 1) {
                return Math.min(2, TOTAL);
              }

              if (qLeaf >= TOTAL) {
                return TOTAL;
              }

              const left = spreadLeft(qLeaf);
              const next = left + 2;

              return next >= TOTAL
                ? TOTAL
                : next;
            }

            function stopVoice() {
              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
              }

              speaking = false;

              const button = $q('qVoice');

              if (button) {
                button.classList.remove('qSpeaking');
                button.textContent = '🔊';
              }
            }

            function turnTo(target, direction) {
              target = clampLeaf(target);

              if (target === qLeaf || turning) {
                return;
              }

              stopVoice();
              turning = true;

              const stageEl = document.getElementById('stage');

              if (!stageEl || typeof stageEl.animate !== 'function') {
                qLeaf = target;
                renderV6();
                turning = false;
                return;
              }

              const sign = direction > 0 ? -1 : 1;

              stageEl.style.transformOrigin =
                direction > 0
                  ? 'left center'
                  : 'right center';

              const outgoing = stageEl.animate(
                [
                  {
                    transform:
                      'perspective(1800px) rotateY(0deg) translateX(0)',
                    opacity: 1,
                    filter: 'brightness(1)'
                  },
                  {
                    transform:
                      `perspective(1800px) rotateY(${sign * 11}deg) translateX(${direction > 0 ? -8 : 8}px)`,
                    opacity: .58,
                    filter: 'brightness(.68)'
                  }
                ],
                {
                  duration: 135,
                  easing: 'ease-in',
                  fill: 'forwards'
                }
              );

              outgoing.onfinish = () => {
                qLeaf = target;
                renderV6();

                stageEl.style.transformOrigin =
                  direction > 0
                    ? 'right center'
                    : 'left center';

                const incoming = stageEl.animate(
                  [
                    {
                      transform:
                        `perspective(1800px) rotateY(${-sign * 8}deg) translateX(${direction > 0 ? 10 : -10}px)`,
                      opacity: .60
                    },
                    {
                      transform:
                        'perspective(1800px) rotateY(0deg) translateX(0)',
                      opacity: 1
                    }
                  ],
                  {
                    duration: 175,
                    easing: 'ease-out'
                  }
                );

                incoming.onfinish = () => {
                  stageEl.style.transformOrigin = 'center center';
                  stageEl.style.transform = 'none';
                  turning = false;
                };
              };
            }

            function gotoLeaf(n) {
              stopVoice();
              qLeaf = clampLeaf(n);
              renderV6();
              document.body.classList.remove('qOpen');
            }

            function readerTextForCurrentLeaf() {
              if (!oldSetMode) {
                return '';
              }

              const source = sourceForLeaf(qLeaf);
              let oldPage = null;
              let text = '';

              try {
                try {
                  oldPage = page;
                  page = source;
                } catch (_) {
                  try {
                    oldPage = window.page;
                    window.page = source;
                  } catch (_) {}
                }

                oldSetMode('reader');

                const reader = document.getElementById('readerView');

                if (reader) {
                  text = (reader.innerText || reader.textContent || '')
                    .replace(/\s+/g, ' ')
                    .trim();
                }

                oldSetMode('book');
              } catch (_) {
                try {
                  oldSetMode('book');
                } catch (_) {}
              } finally {
                if (oldPage !== null) {
                  try {
                    page = oldPage;
                  } catch (_) {
                    try {
                      window.page = oldPage;
                    } catch (_) {}
                  }
                }
              }

              return text;
            }

            function speakCurrentLeaf() {
              if (speaking) {
                stopVoice();
                return;
              }

              const button = $q('qVoice');

              if (!('speechSynthesis' in window)) {
                if (button) {
                  button.textContent = '×';
                  setTimeout(() => {
                    button.textContent = '🔊';
                  }, 1000);
                }
                return;
              }

              const text = readerTextForCurrentLeaf();
              renderV6();

              if (!text || text.length < 8) {
                if (button) {
                  button.textContent = '…';
                  setTimeout(() => {
                    button.textContent = '🔊';
                  }, 1000);
                }
                return;
              }

              window.speechSynthesis.cancel();

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'sq-AL';
              utterance.rate = 0.92;
              utterance.pitch = 1.0;

              const voices = window.speechSynthesis.getVoices();
              const albanian = voices.find(voice =>
                String(voice.lang || '')
                  .toLowerCase()
                  .startsWith('sq')
              );

              if (albanian) {
                utterance.voice = albanian;
              }

              utterance.onstart = () => {
                speaking = true;

                if (button) {
                  button.classList.add('qSpeaking');
                  button.textContent = '■';
                }
              };

              utterance.onend =
              utterance.onerror = () => {
                speaking = false;

                if (button) {
                  button.classList.remove('qSpeaking');
                  button.textContent = '🔊';
                }
              };

              window.speechSynthesis.speak(utterance);
            }

            try {
              window.go = d => {
                turnTo(
                  d > 0 ? nextTarget() : previousTarget(),
                  d > 0 ? 1 : -1
                );
              };
              go = window.go;
            } catch (_) {}

            document.body.insertAdjacentHTML(
              'beforeend',
              `
                <button id="qMenu" aria-label="Menu">☰</button>
                <button id="qPrev" aria-label="Faqja para">‹</button>
                <button id="qNext" aria-label="Faqja tjetër">›</button>
                <button id="qVoice" aria-label="Lexo me zë">🔊</button>
                <div id="qCount"></div>

                <div id="qShade"></div>

                <aside id="qDrawer">
                  <div id="qHead">
                    <strong>Histori dhe Legjenda nën Qiri</strong>
                    <button id="qClose" aria-label="Mbyll">×</button>
                  </div>

                  <h3>Pjesët</h3>
                  <div id="qSections"></div>

                  <h3>Të gjitha faqet</h3>
                  <div id="qPages"></div>
                </aside>
              `
            );

            $q('qMenu').onclick = () => {
              document.body.classList.add('qOpen');
              updateControls();

              setTimeout(() => {
                const active =
                  document.querySelector('#qPages button.on');

                if (active) {
                  active.scrollIntoView({
                    block: 'center'
                  });
                }
              }, 40);
            };

            $q('qClose').onclick =
            $q('qShade').onclick = () => {
              document.body.classList.remove('qOpen');
            };

            $q('qPrev').onclick = () => {
              turnTo(previousTarget(), -1);
            };

            $q('qNext').onclick = () => {
              turnTo(nextTarget(), 1);
            };

            $q('qVoice').onclick = speakCurrentLeaf;

            SECTIONS.forEach(([title, sourcePage]) => {
              const button = document.createElement('button');
              button.textContent = title;
              button.onclick = () => {
                gotoLeaf(firstLeafForSource(sourcePage));
              };
              $q('qSections').appendChild(button);
            });

            for (let n = 1; n <= TOTAL; n++) {
              const button = document.createElement('button');
              button.textContent = n;
              button.dataset.leaf = n;
              button.onclick = () => gotoLeaf(n);
              $q('qPages').appendChild(button);
            }

            document.addEventListener(
              'touchstart',
              event => {
                if (document.body.classList.contains('qOpen')) {
                  return;
                }

                const touch =
                  event.changedTouches &&
                  event.changedTouches[0];

                if (!touch) return;

                startX = touch.clientX;
                startY = touch.clientY;
              },
              true
            );

            document.addEventListener(
              'touchend',
              event => {
                if (document.body.classList.contains('qOpen')) {
                  return;
                }

                const touch =
                  event.changedTouches &&
                  event.changedTouches[0];

                if (!touch) return;

                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;

                if (
                  Math.abs(dx) > 55 &&
                  Math.abs(dx) > Math.abs(dy) * 1.25
                ) {
                  event.preventDefault();
                  event.stopImmediatePropagation();

                  if (dx < 0) {
                    turnTo(nextTarget(), 1);
                  } else {
                    turnTo(previousTarget(), -1);
                  }
                }
              },
              true
            );

            function reflow() {
              clearTimeout(resizeTimer);

              resizeTimer = setTimeout(() => {
                stopVoice();

                if (
                  landscape() &&
                  qLeaf > 1 &&
                  qLeaf < TOTAL
                ) {
                  qLeaf = spreadLeft(qLeaf);
                }

                renderV6();
              }, 100);
            }

            window.addEventListener('resize', reflow);
            window.addEventListener('orientationchange', reflow);

            if (
              screen.orientation &&
              typeof screen.orientation.addEventListener === 'function'
            ) {
              screen.orientation.addEventListener('change', reflow);
            }

            try {
              if (oldSetMode) {
                oldSetMode('book');
              }
            } catch (_) {}

            renderV6();
          })();

          JS

      - name: Enable Android immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              'project/app/src/main/java/al/kostumiim/nenqiri/MainActivity.java'
          )

          text = p.read_text()

          marker = '        super.onCreate(b);\n'

          code = '''        getWindow().setFlags(
              android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
              android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
          );
          getWindow().getDecorView().setSystemUiVisibility(
              android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
              android.view.View.SYSTEM_UI_FLAG_FULLSCREEN |
              android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
              android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
              android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
              android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
          );
          '''

          if 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' not in text:
              if marker not in text:
                  raise SystemExit('onCreate marker not found')

              text = text.replace(
                  marker,
                  marker + code,
                  1
              )

              p.write_text(text)
          PY

