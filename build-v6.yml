name: Build Android APK V6 Immersive Book

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android project
        run: |
          cat QIRI_ANDROID_API36_PART1.bin QIRI_ANDROID_API36_PART2.bin > qiri.zip
          rm -rf project
          mkdir -p project
          unzip -q qiri.zip -d project

          test -f project/app/src/main/assets/www/index.html
          test -f project/app/src/main/assets/www/app.js
          test -f project/app/src/main/assets/www/app.css
          test -f project/app/src/main/assets/www/pages/1.webp
          test -f project/app/src/main/assets/www/pages/118.webp

      - name: Correct 1991 Vlora scene
        run: |
          cat > /tmp/vlora_page30.webp.b64 <<'B64'
          
          B64
          base64 -d /tmp/vlora_page30.webp.b64 \
            > project/app/src/main/assets/www/pages/30.webp
          test -s project/app/src/main/assets/www/pages/30.webp

      - name: Build uniform book leaves
        run: |
          python3 -m pip install --quiet pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          import re
          import shutil

          www = Path('project/app/src/main/assets/www')
          pages = www / 'pages'
          leaves_dir = www / 'leaf_pages'

          if leaves_dir.exists():
              shutil.rmtree(leaves_dir)
          leaves_dir.mkdir(parents=True)

          def numeric_key(path):
              m = re.search(r'(\d+)', path.stem)
              return int(m.group(1)) if m else 10**9

          source_files = sorted(pages.glob('*.webp'), key=numeric_key)

          if not source_files:
              raise SystemExit('No WebP pages found')

          leaves = []
          source_first = {}

          for src in source_files:
              source_no = numeric_key(src)

              with Image.open(src) as im:
                  w, h = im.size

                  # Two-page spreads are wider than a normal portrait leaf.
                  is_spread = w > h * 1.15

                  source_first[str(source_no)] = len(leaves) + 1

                  if is_spread:
                      mid = w // 2
                      halves = [
                          ('L', im.crop((0, 0, mid, h))),
                          ('R', im.crop((mid, 0, w, h))),
                      ]

                      for half_name, half in halves:
                          out_no = len(leaves) + 1
                          out_name = f'{out_no:04d}.webp'
                          out = leaves_dir / out_name
                          half.save(out, 'WEBP', quality=92, method=6)
                          leaves.append({
                              'file': f'leaf_pages/{out_name}',
                              'source': source_no,
                              'half': half_name,
                          })
                  else:
                      out_no = len(leaves) + 1
                      out_name = f'{out_no:04d}.webp'
                      out = leaves_dir / out_name
                      shutil.copy2(src, out)
                      leaves.append({
                          'file': f'leaf_pages/{out_name}',
                          'source': source_no,
                          'half': 'S',
                      })

          data = (
              'window.QIRI_LEAVES='
              + json.dumps(leaves, ensure_ascii=False, separators=(',', ':'))
              + ';\nwindow.QIRI_SOURCE_FIRST='
              + json.dumps(source_first, ensure_ascii=False, separators=(',', ':'))
              + ';\n'
          )

          (www / 'leaf-data.js').write_text(data, encoding='utf-8')

          index = www / 'index.html'
          html = index.read_text(encoding='utf-8')

          if 'leaf-data.js' not in html:
              pat = re.compile(
                  r'(<script\b[^>]*\bsrc=["\'](?:\./)?app\.js["\'][^>]*>)',
                  re.I,
              )
              m = pat.search(html)

              if m:
                  html = (
                      html[:m.start()]
                      + '<script src="leaf-data.js"></script>\n'
                      + html[m.start():]
                  )
              elif '</body>' in html.lower():
                  pos = html.lower().rfind('</body>')
                  html = (
                      html[:pos]
                      + '<script src="leaf-data.js"></script>\n'
                      + html[pos:]
                  )
              else:
                  html += '\n<script src="leaf-data.js"></script>\n'

              index.write_text(html, encoding='utf-8')

          print('Source assets:', len(source_files))
          print('Logical book leaves:', len(leaves))
          PY

          test -f project/app/src/main/assets/www/leaf-data.js
          test -f project/app/src/main/assets/www/leaf_pages/0001.webp

