      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          S="$(
            find /usr/local/lib/android/sdk/cmdline-tools \
              -type f \
              -name sdkmanager |
            sort -V |
            tail -n 1
          )"

          test -n "$S"

          yes | "$S" --licenses >/dev/null || true

          "$S" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Histori-Legjenda-Nen-Qiri-APK-V6
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
